name: Release build

# One pipeline, two release paths:
# - push to main    -> rolling prerelease tagged `main-build`, replaced on
#                      every push and never shadowing the stable Latest
# - push of a v* tag -> stable release for that tag (the versioned path)
# Manual dispatch builds main the same way as a main push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app and publish release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout (full history for version and build number)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          cmake --version | head -1
          swift --version 2>&1 | head -1

      - name: Detect release mode and version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Stable release: the tag itself carries the version.
            VERSION="${GITHUB_REF_NAME#v}"
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          else
            # Rolling main build: newest v* tag plus short commit hash. Only
            # real v* tags seed the version; the rolling `main-build` release
            # tag must never be picked up as the base.
            BASE="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || true)"
            BASE="${BASE:-0.1.1}"
            SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            VERSION="${BASE}-main.${SHA}"
            echo "kind=rolling" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "kind/version resolved: ${VERSION}"

      - name: Build pinned whisper.cpp runtime
        run: ./scripts/setup-whispercpp.sh

      - name: Build WhisperMac.app
        env:
          WHISPERMAC_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/build-app-bundle.sh

      - name: Create release assets (zip + sha256)
        run: ./scripts/create-release-assets.sh "${{ steps.ver.outputs.version }}"

      - name: Upload assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperMac-${{ steps.ver.outputs.version }}
          path: dist/release-assets/*
          if-no-files-found: error

      - name: "Publish rolling prerelease (tag: main-build)"
        if: steps.ver.outputs.kind == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Replace the previous rolling build; keep exactly one `main-build`
          # prerelease alive so the Releases page stays clean.
          gh release delete main-build --yes --cleanup-tag 2>/dev/null || true
          NOTES="$(printf 'Automated build of main @ %s.\n\n- Version: %s\n- Ad-hoc signed, not notarized; see the README installation notes for the Gatekeeper workaround.\n- Replaced automatically on every push to main.' "$GITHUB_SHA" "$VERSION")"
          gh release create main-build dist/release-assets/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Main branch build (${VERSION})" \
            --notes "$NOTES"

      - name: Publish stable release for the tag
        if: steps.ver.outputs.kind == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets only." >&2
            gh release upload "$GITHUB_REF_NAME" dist/release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/release-assets/* \
              --title "WhisperMac v${VERSION}" \
              --generate-notes
          fi
