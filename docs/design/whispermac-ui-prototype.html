const iconPaths={plus:'M8 3v10M3 8h10',history:'M2 7a6 6 0 1 1 1 5M2 3v4h4M8 4v4l3 2',settings:'M6 2h4l.7 2 2 .7v4l-2 .7-.7 2H6l-.7-2-2-.7v-4l2-.7zM10 7a2 2 0 1 1-4 0 2 2 0 0 1 4 0',file:'M4 1h5l3 3v11H4zM9 1v4h3M6 8h4M6 11h4',upload:'M3 11v3h10v-3M8 11V2M4 6l4-4 4 4',check:'M3 8l3 3 7-7',cross:'M4 4l8 8M12 4l-8 8',folder:'M1 4h6l2 2h6v8H1z',arrow:'M3 8h10M9 4l4 4-4 4',alert:'M8 1l7 13H1zM8 5v4M8 11v.1',lock:'M4 7V5a4 4 0 0 1 8 0v2M3 7h10v8H3z'};
const icon=(name)=>`<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="${iconPaths[name]||iconPaths.file}"/></svg>`;
const app=document.getElementById('app');let lang='zh',state='empty',files=[],formats=new Set(['TXT','SRT']),selected=0,follow=true,optionsOpen=false,cancelled=false,audioLanguage='auto',translate=false;const samples=['interview.m4a','team-meeting.mp4','field-notes.wav'];
const $=id=>document.getElementById(id);const t=k=>strings[lang][k];
function button(text,action,cls='',disabled=false,ico=''){return `<button class="btn ${cls}" data-action="${action}" ${disabled?'disabled':''}>${ico?icon(ico):''}${text}</button>`}
function changeState(next,preserveFiles=false){state=next;cancelled=false;optionsOpen=false;if(!preserveFiles){if(next==='empty'||next==='missing'||next==='downloading')files=[];else if(!files.length)files=[...samples];}if(next==='done'||next==='no-preview'){files=[...samples];formats=new Set(next==='no-preview'?['TXT']:['TXT','SRT']);selected=0;}$('state').value=next;render()}
function render(){
 app.dataset.state=state;
 document.documentElement.lang=lang==='zh'?'zh-Hans':lang;const busy=state==='running'||state==='downloading';
 $('toolbar').innerHTML=button(t('add'),'add','quiet',busy,'plus')+button(t('history'),'history','quiet',false,'history')+button(t('settings'),'settings','quiet',false,'settings');
 $('queue').innerHTML=`<div class="queue-head"><span class="eyebrow">${t('queue')}</span><span class="count">${files.length}</span></div><div class="queue-list">${files.length?files.map((f,i)=>`<div class="file-row ${(state==='done'||state==='no-preview')&&i===selected?'active':''}" ${(state==='done'||state==='no-preview')?`tabindex="0" role="button" data-file="${i}" aria-label="${f}, ${t(state==='no-preview'?'output':'preview')}"`:''}><span class="file-icon">${icon('file')}</span><div class="file-info"><span class="file-name" title="${f}">${f}</span><div class="file-sub">${(state==='done'||state==='no-preview')?t('outputReady'):busy?t('batch'):t('added')}</div></div>${!busy&&!['done','no-preview'].includes(state)?`<button class="remove" data-remove="${i}" aria-label="${t('remove')} ${f}">${icon('cross')}</button>`:''}</div>`).join(''):`<div class="queue-empty">${t('emptyQueue')}<br>${t('emptyHint')}</div>`}</div><div class="queue-bottom"><span class="hint">${icon('lock')} ${t('local')}</span><button class="link-button" data-action="clear" ${busy||!files.length?'disabled':''}>${t('clear')}</button></div>`;
 const main=$('main');main.innerHTML=optionsOpen||state==='ready'?readyView():state==='empty'?emptyView():state==='running'?runningView():state==='done'?doneView():state==='no-preview'?noPreviewView():state==='missing'||state==='downloading'?runtimeView():state==='cancelled'?cancelView():errorView();main.scrollTop=0;
 main.firstElementChild?.classList.add('state-enter');renderFooter();

}
function header(title,sub){return `<div class="main-header"><h1>${title}</h1><p class="subtitle">${sub}</p></div>`}
function emptyView(){return header(t('prepare'),t('prepareSub'))+`<div class="drop-zone" id="drop-zone">${icon('upload')}<h2>${t('dropTitle')}</h2><p>${t('dropHint')}</p>${button(t('add'),'add','primary',false,'plus')}</div><div class="defaults"><div class="section-heading"><h2>${t('defaults')}</h2><button class="link-button" data-action="options">${t('adjust')}</button></div><div class="summary-row"><span>${t('destination')}</span><strong>${t('follow')}</strong></div><div class="summary-row"><span>${t('formats')}</span><strong>${[...formats].join(' · ')}</strong></div><div class="summary-row"><span>${t('language')}</span><strong>${audioLanguage==='auto'?t('auto'):audioLanguage.toUpperCase()}</strong></div></div>`}
function readyView(){return header(cancelled?t('cancelled'):t('prepare'),cancelled?t('cancelSub'):t('prepareSub'))+`<section class="option-section"><h2>${t('output')}</h2><div class="field-row"><label for="destination">${t('destination')}</label><select class="field" id="destination"><option>${t('follow')}</option><option value="custom">${t('custom')}</option></select></div><div class="field-row"><span class="field-label">${t('formats')}</span><div class="formats">${['TXT','SRT','VTT','JSON'].map(f=>`<label><input type="checkbox" data-format="${f}" ${formats.has(f)?'checked':''} ${formats.has(f)&&formats.size===1?'disabled':''} aria-describedby="format-hint">${f}${f==='TXT'?' · '+({zh:'文本',en:'Text',ja:'テキスト'}[lang]):f==='SRT'?' · '+({zh:'字幕',en:'Subtitles',ja:'字幕'}[lang]):''}</label>`).join('')}</div></div><p class="hint format-hint" id="format-hint">${t('formatHint')}</p></section><section class="option-section"><h2>${t('transcription')}</h2><div class="field-row"><label for="audio-language">${t('language')}</label><select class="field" id="audio-language"><option value="auto" ${audioLanguage==='auto'?'selected':''}>${t('auto')}</option><option value="zh" ${audioLanguage==='zh'?'selected':''}>中文</option><option value="en" ${audioLanguage==='en'?'selected':''}>English</option><option value="ja" ${audioLanguage==='ja'?'selected':''}>日本語</option></select></div><div class="field-row"><span></span><label class="check-label"><input type="checkbox" id="translate" ${translate?'checked':''}>${t('translate')}</label></div></section><section class="option-section"><div class="section-heading"><h2>${t('runtime')}</h2><span class="inline-good">${icon('check')}${t('runtimeReady')}</span></div><div class="runtime"><div><strong>large-v3-turbo</strong><div class="runtime-detail">GPU + ANE</div></div><button class="link-button" data-action="settings">${t('settings')}…</button></div></section>`}
const transcript={zh:['这次采访想先聊聊你的早晨。你之前提到，每天都会留一点时间，走到附近的河边。','是的。那段路不长，大概十五分钟。没有特别的目的，只是看看天气，听一听周围的声音。','有时候会遇到同样的人，有时候会发现一家刚开门的小店。这些很小的变化，反而让我记得更清楚。','所以我开始把它们记下来。回头再看，普通的一天也有很多值得保留的细节。'],en:['I would like to start with your mornings. You mentioned taking a little time each day to walk down to the river.','Yes. It is a short walk, about fifteen minutes. There is no particular destination. I just notice the weather and listen to the sounds around me.','Sometimes I meet the same people. Sometimes a new shop has opened. Those small changes are often what I remember most clearly.','So I started writing them down. Looking back, even an ordinary day has details worth keeping.'],ja:['まず、朝の過ごし方について聞かせてください。毎日少し時間を取って、近くの川まで歩くそうですね。','はい。十五分ほどの短い道のりです。特に目的はなく、天気を確かめたり、周りの音を聞いたりしています。','同じ人に会う日もあれば、新しく開いた店に気づく日もあります。そうした小さな変化が、よく記憶に残ります。','それで、書き留めるようになりました。振り返ってみると、普通の一日にも残しておきたいことがあります。']};
function segments(){return `<div class="segments">${transcript[lang].map((p,i)=>`<div class="segment"><span class="timestamp">00:${['00','12','25','41'][i]}</span><p>${(state==='done'||state==='no-preview')&&i===0&&selected>0?({zh:['','今天的会议围绕项目进展展开，我们先确认本周已完成的工作。','这是一段现场记录，我们正在整理采访中的关键观察。'],en:['','Today’s meeting begins with a review of the work completed this week.','These field notes collect the key observations from our interview.'],ja:['','今日の会議では、今週完了した作業を確認します。','インタビューで得られた主な気づきを、この記録にまとめます。']}[lang][selected]):p}</p></div>`).join('')}</div>`}
function runningView(){return header(t('working'),t('workingSub'))+`<div class="batch-summary"><span>${strings[lang].countFiles(files.length)}</span><span>${[...formats].join(' + ')}</span><span>GPU + ANE</span>${button(t('options'),'run-options','quiet')}</div><div class="transcript-head"><h2>${t('live')}</h2><span class="live-tag"><span class="live-dot"></span>${t('liveLabel')}</span></div>${segments()}<div class="transcript-note"><span>${t('liveNote')}</span><label class="check-label"><input type="checkbox" id="follow" ${follow?'checked':''}>${t('followLatest')}</label></div>`}
function doneView(){return `<div class="success-label">${icon('check')}${t('result')}</div>`+header(t('complete'),t('completeSub'))+`<div class="output-selector"><select class="field" id="output-file" aria-label="${t('preview')}">${files.map((f,i)=>`<option value="${i}" ${i===selected?'selected':''}>${f.replace(/\.[^.]+$/,'.srt')}</option>`).join('')}</select>${button(t('allOutputs'),'outputs','',false,'folder')}</div><div class="transcript-head"><h2>${t('preview')}</h2><span class="hint">SRT</span></div>${segments()}<div class="transcript-note"><span>${t('previewNote')}</span><span>TXT + SRT</span></div>`}
function runtimeView(){const downloading=state==='downloading';return header(t(downloading?'downloadTitle':'missingTitle'),t(downloading?'downloadSub':'missingSub'))+`<div class="runtime-placeholder">${icon(downloading?'upload':'file')}<h2 style="font-size:16px;font-weight:600">large-v3-turbo</h2><p>${t(downloading?'downloadStage':'downloadPrivacy')}</p>${downloading?`<div class="progress-row"><div class="progress" role="progressbar" aria-valuenow="39" aria-valuemin="0" aria-valuemax="100" aria-label="${t('downloadStage')}"><span style="width:39%"></span></div><span class="progress-value">39%</span></div><p>${t('downloadBytes')}</p>`:`<div class="runtime-buttons">${button(t('download'),'download','primary',false,'arrow')}${button(t('chooseModel'),'choose-model','quiet')}</div>`}</div>`}
function cancelView(){return header(t('cancelTitle'),t('cancelHint'))+`<div class="error-box"><p>${t('cancelSub')}</p>${button(t('adjust'),'options')}</div>`}
function noPreviewView(){return `<div class="success-label">${icon('check')}${t('result')}</div>`+header(t('complete'),t('noPreviewSub'))+`<div class="output-selector"><select class="field" id="output-file" aria-label="${t('output')}">${files.map((f,i)=>`<option value="${i}" ${i===selected?'selected':''}>${f.replace(/\.[^.]+$/,'.txt')}</option>`).join('')}</select>${button(t('allOutputs'),'outputs','',false,'folder')}</div><div class="runtime-placeholder">${icon('file')}<h2 style="font-size:16px">${t('noPreview')}</h2><p>${t('noPreviewHint')}</p></div>`}
function renderFooter(){
 const running=state==='running',downloading=state==='downloading',done=state==='done'||state==='no-preview';
 const title=running?t('working'):downloading?t('downloadTitle'):state==='missing'?t('missingHint'):done?t('result'):state==='error'?t('error'):state==='cancelled'?t('cancelled'):files.length?strings[lang].countReady(files.length):t('startHint');
 const detail=done?t('doneHint'):state==='error'?t('errorSub'):state==='cancelled'?t('cancelHint'):downloading?t('downloadStage'):t('readyHint');
 const actions=running?button(t('logs'),'logs','quiet')+button(t('stop'),'stop','danger'):downloading?button(t('cancelDownload'),'cancel-download','danger'):state==='missing'?button(t('start'),'start','primary',true):done?button(t('newTask'),'new','quiet')+button(t(state==='done'?'selectedFinder':'selectedOutput'),'finder','primary',false,'folder'):state==='error'?button(t('logs'),'logs','quiet')+button(t('retry'),'start','primary'):state==='cancelled'?button(t('again'),'start','primary'):button(t('start'),'start','primary',!files.length,'arrow');
 $('footer').innerHTML=`<div class="footer-status"><div class="footer-title">${done?icon('check'):state==='error'?icon('alert'):''}${title}</div>${running?`<div class="progress-row"><div class="progress" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-label="${t('estimate')}"><span></span></div><span class="progress-value">${t('estimate')} 64%</span></div>`:`<div class="footer-detail">${detail}</div>`}</div><div class="footer-actions">${actions}</div>`;
}
function errorView(){return header(t('error'),t('errorSub'))+`<div class="error-box"><h2>${icon('alert')} ${t('errorTitle')}</h2><p>${t('errorDetail')}</p>${button(t('logs'),'logs')}</div>`}
let noticeTimer;function notice(text){app.querySelector('.notice')?.remove();const el=document.createElement('div');el.className='notice';el.setAttribute('role','status');el.textContent=text;$('main').append(el);clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.remove(),4000)}
function dialog(title,html){$('dialog-title').textContent=title;$('dialog-body').innerHTML=html;if(!$('dialog').open)$('dialog').showModal()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled){const a=b.dataset.action;if(a==='add'){files=[...samples];if(state!=='missing')state='ready';optionsOpen=false;$('state').value=state;render()}if(a==='clear')changeState('empty');if(a==='new')changeState('ready',true);if(a==='options'){optionsOpen=true;if(state==='cancelled'){state='ready';$('state').value=state;}render()}if(a==='start'){changeState('running')}if(a==='stop')changeState('cancelled');if(a==='download')changeState('downloading',true);if(a==='cancel-download')changeState('missing',true);if(a==='choose-model')notice(t('chooseDemo'));if(a==='finder'){if($('dialog').open)$('dialog').close();notice(t('finderDemo'));}if(a==='settings')dialog(t('settings'),`<p>${t('settingsHint')}</p><div class="dialog-line"><strong>${t('model')}</strong><br><code>…/WhisperMac/runtime/Models/ggml-large-v3-turbo.bin</code></div><div class="dialog-line"><strong>${t('cli')}</strong><br><code>…/WhisperMac.app/Contents/Resources/runtime/bin/whisper-cli</code></div><span class="inline-good">${icon(['missing','downloading'].includes(state)?'alert':'check')}${t(state==='missing'?'missingHint':state==='downloading'?'downloadTitle':'downloadHint')}</span><div class="dialog-line">${button(t('help'),'help','quiet')}</div>`);if(a==='help')dialog(t('help'),'<p>WhisperMac</p><p><a href="https://github.com/sxsxsx-git/whispermac#readme" target="_blank" rel="noreferrer">README</a></p><p><a href="https://github.com/sxsxsx-git/whispermac/blob/main/docs/installation.md" target="_blank" rel="noreferrer">Installation</a></p>');if(a==='outputs')dialog(t('allOutputs'),files.flatMap(f=>[...formats].map(x=>x.toLowerCase()).map(ext=>`<div class="dialog-line"><strong>${f.replace(/\.[^.]+$/,'.'+ext)}</strong><br><code>~/Media/${f.replace(/\.[^.]+$/,'.'+ext)}</code><br>${button(t('finder'),'finder','quiet',false,'folder')}</div>`)).join(''));if(a==='history')dialog(t('history'),`<strong>${t('historyEmpty')}</strong><p>${t('historyDetail')}</p>${samples.map(f=>`<div class="dialog-line">${f}</div>`).join('')}`);if(a==='run-options')dialog(t('options'),`<p>${t('readOnly')}</p><div class="dialog-line">${t('destination')} · ${t('follow')}</div><div class="dialog-line">${t('formats')} · ${[...formats].join(' + ')}</div><div class="dialog-line">${t('language')} · ${audioLanguage==='auto'?t('auto'):({zh:'中文',en:'English',ja:'日本語'}[audioLanguage])} · ${translate?t('translationOn'):t('translationOff')}</div><div class="dialog-line">GPU + ANE</div>`);if(a==='logs')dialog(t('logs'),`<code id="log-text">[demo] Audio preparation started<br>[demo] ${state==='error'?'afconvert: unable to decode interview.m4a':'Audio preparation completed<br>[demo] whisper-cli: batch transcription started'}</code><p>${button(t('copy'),'copy')}</p>`);if(a==='copy'){Promise.resolve(navigator.clipboard? navigator.clipboard.writeText($('log-text').innerText):Promise.reject(new Error('Clipboard unavailable'))).then(()=>{b.textContent=t('copied')}).catch(()=>{const range=document.createRange();range.selectNodeContents($('log-text'));getSelection().removeAllRanges();getSelection().addRange(range)})}}const remove=e.target.closest('[data-remove]');if(remove&&!['running','downloading'].includes(state)){files.splice(Number(remove.dataset.remove),1);if(!files.length)state='empty';render()}const row=e.target.closest('[data-file]');if(row){selected=Number(row.dataset.file);render()}});
app.addEventListener('keydown',e=>{const row=e.target.closest('[data-file]');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selected=Number(row.dataset.file);render()}});
app.addEventListener('change',e=>{if(e.target.dataset.format){const f=e.target.dataset.format;if(e.target.checked)formats.add(f);else if(formats.size>1)formats.delete(f);else{e.target.checked=true;notice(t('formatHint'))}}if(e.target.id==='output-file'){selected=Number(e.target.value);render()}if(e.target.id==='destination'&&e.target.value==='custom'){e.target.selectedIndex=0;notice(t('chooseDemo'))}if(e.target.id==='follow')follow=e.target.checked;if(e.target.id==='audio-language')audioLanguage=e.target.value;if(e.target.id==='translate')translate=e.target.checked;if(e.target.dataset.format){app.querySelectorAll('[data-format]').forEach(input=>input.disabled=formats.size===1&&formats.has(input.dataset.format));}});
app.addEventListener('dragover',e=>{e.preventDefault();if(!['running','downloading'].includes(state))app.classList.add('dragging')});app.addEventListener('dragleave',e=>{if(!app.contains(e.relatedTarget))app.classList.remove('dragging')});app.addEventListener('drop',e=>{e.preventDefault();app.classList.remove('dragging');if(!['running','downloading'].includes(state)){files=[...samples];if(state!=='missing')state='ready';$('state').value=state;render();notice(t('importDemo'))}});
$('large-text').onchange=e=>app.classList.toggle('large-text',e.target.checked);

document.getElementById('close-dialog').onclick=()=>$('dialog').close();$('state').onchange=e=>changeState(e.target.value);$('language').onchange=e=>{lang=e.target.value;render()};$('theme').onchange=e=>app.classList.toggle('dark',e.target.value==='dark');$('size').onchange=e=>{app.style.width=e.target.value+'px';app.style.height=e.target.value==='980'?'720px':'800px'};
const params=new URLSearchParams(location.search);if(params.has('still'))app.classList.add('still');if(strings[params.get('lang')]){lang=params.get('lang');$('language').value=lang}if(params.get('theme')==='dark'){app.classList.add('dark');$('theme').value='dark'}if(['empty','ready','running','done','error','missing','downloading','cancelled','no-preview'].includes(params.get('state')))changeState(params.get('state'));else render();
</script>
